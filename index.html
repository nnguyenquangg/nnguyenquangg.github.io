<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#9fd8ff">
  <title>Lynk 💗</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-stage="0" data-ready="1">
  <div class="scene" id="scene">

    <div class="sky sky-day"></div>
    <div class="sky sky-sunset"></div>
    <div class="sky sky-night"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="sun"></div>
    <div class="moon"><span class="crater c1"></span><span class="crater c2"></span></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <span class="butterfly" aria-hidden="true">🦋</span>
    <span class="bird" aria-hidden="true">🐦</span>

    <div class="ground">
      <span class="flower f1">🌷</span>
      <span class="flower f2">🌼</span>
      <span class="flower f3">🌸</span>
      <span class="flower f4">🌷</span>
      <span class="flower f5">🌼</span>
      <span class="cat" aria-hidden="true">🐈</span>
    </div>

    <!-- DOG: Ngác -->
    <div class="dog" id="dog" aria-label="chó Ngác">
      <div class="dog-bubble" id="dog-bubble"></div>
      <div class="dog-name">Ngác</div>
      <div class="dog-flip">
        <svg class="dog-svg" viewBox="0 0 100 70">
          <g class="tail"><path d="M20 36 C8 30 6 18 14 14" stroke="#e8b77a" stroke-width="7" stroke-linecap="round" fill="none"/></g>
          <g class="dleg dleg-a"><rect x="24" y="46" width="9" height="20" rx="4.5" fill="#d9a35f"/></g>
          <g class="dleg dleg-b"><rect x="36" y="46" width="9" height="20" rx="4.5" fill="#e8b77a"/></g>
          <g class="dleg dleg-a"><rect x="54" y="46" width="9" height="20" rx="4.5" fill="#d9a35f"/></g>
          <g class="dleg dleg-b"><rect x="66" y="46" width="9" height="20" rx="4.5" fill="#e8b77a"/></g>
          <ellipse cx="47" cy="42" rx="28" ry="15" fill="#e8b77a"/>
          <ellipse cx="47" cy="49" rx="18" ry="8" fill="#fbe3bd"/>
          <rect x="60" y="30" width="7" height="22" rx="3.5" fill="#ff4d79"/>
          <g class="dhead">
            <circle cx="76" cy="27" r="16" fill="#e8b77a"/>
            <g class="ear"><path d="M63 18 C56 22 56 38 64 40 C70 38 70 24 63 18Z" fill="#c48a4a"/></g>
            <ellipse cx="86" cy="33" rx="10" ry="7" fill="#fbe3bd"/>
            <circle cx="93" cy="31" r="3.2" fill="#2b2b3a"/>
            <ellipse cx="86" cy="40" rx="3.5" ry="4" fill="#ff7aa2"/>
            <g class="deye"><circle cx="78" cy="23" r="3" fill="#2b2b3a"/><circle cx="79" cy="22" r="1" fill="#fff"/></g>
            <ellipse cx="72" cy="31" rx="4" ry="2.3" fill="#ff9bb3" opacity=".6"/>
          </g>
        </svg>
      </div>
    </div>

    <svg class="big-heart" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 88 C10 60 2 34 18 20 C30 10 44 16 50 28 C56 16 70 10 82 20 C98 34 90 60 50 88Z" fill="#ff4d79"/>
      <path d="M30 30 C26 34 25 40 27 44" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>
    </svg>


    <!-- BOY -->
    <div class="actor boy">
    <div class="bubble" id="boy-bubble" aria-live="polite"></div>
    <svg class="char" viewBox="0 0 120 170" aria-label="chàng trai">
      <g class="legs">
        <g class="leg leg-l"><rect x="43" y="116" width="15" height="36" rx="7" fill="#3b4a6b"/><ellipse cx="50" cy="153" rx="12" ry="6" fill="#2b2b3a"/></g>
        <g class="leg leg-r"><rect x="62" y="116" width="15" height="36" rx="7" fill="#3b4a6b"/><ellipse cx="69" cy="153" rx="12" ry="6" fill="#2b2b3a"/></g>
      </g>
      <g class="arm arm-l"><rect x="28" y="90" width="13" height="36" rx="6.5" fill="#4f8df7"/><circle cx="34.5" cy="127" r="7" fill="#ffd9b8"/></g>
      <rect class="body" x="36" y="84" width="48" height="48" rx="18" fill="#4f8df7"/>
      <circle cx="60" cy="100" r="4" fill="#fff" opacity=".9"/>
      <circle cx="60" cy="114" r="4" fill="#fff" opacity=".9"/>
      <g class="head">
        <circle cx="60" cy="54" r="36" fill="#ffd9b8"/>
        <ellipse cx="24" cy="58" rx="5" ry="7" fill="#ffd9b8"/>
        <ellipse cx="96" cy="58" rx="5" ry="7" fill="#ffd9b8"/>
        <path class="hair" d="M24 58 C22 -6 98 -6 96 58 C92 44 84 46 78 52 C74 40 62 38 56 48 C50 38 40 42 36 50 C32 44 26 48 24 58 Z" fill="#4a2e1f"/>
        <ellipse class="blush" cx="36" cy="68" rx="7" ry="4" fill="#ff9bb3"/>
        <ellipse class="blush" cx="84" cy="68" rx="7" ry="4" fill="#ff9bb3"/>
        <g class="eyes">
          <g class="eye"><ellipse cx="46" cy="60" rx="4.5" ry="6.5" fill="#2b2b3a"/><circle cx="48" cy="57.5" r="1.8" fill="#fff"/></g>
          <g class="eye"><ellipse cx="74" cy="60" rx="4.5" ry="6.5" fill="#2b2b3a"/><circle cx="76" cy="57.5" r="1.8" fill="#fff"/></g>
        </g>
        <g class="heart-eyes">
          <path d="M46 65 C37 58 41 51 46 56 C51 51 55 58 46 65Z" fill="#ff4d79"/>
          <path d="M74 65 C65 58 69 51 74 56 C79 51 83 58 74 65Z" fill="#ff4d79"/>
        </g>
        <path class="mouth" d="M52 76 Q60 84 68 76" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="mouth-open" d="M53 75 Q60 88 67 75 Z" fill="#c0392b"/>
      </g>
      <g class="arm arm-r">
        <rect x="79" y="90" width="13" height="36" rx="6.5" fill="#4f8df7"/>
        <circle cx="85.5" cy="127" r="7" fill="#ffd9b8"/>
        <g class="gift">
          <path d="M85.5 140 C70 128 76 114 85.5 122 C95 114 101 128 85.5 140Z" fill="#ff4d79"/>
          <path d="M79 121 C77.5 122.5 77 125 77.5 127" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".8"/>
        </g>
      </g>
    </svg>

    </div>

    <!-- GIRL -->
    <div class="actor girl">
    <div class="bubble" id="girl-bubble" aria-live="polite"></div>
    <svg class="char" viewBox="0 0 120 170" aria-label="cô gái">
      <path class="hair-back" d="M22 60 C20 -4 100 -4 98 60 L100 118 C86 128 34 128 20 118 Z" fill="#5a3a2a"/>
      <g class="legs">
        <g class="leg leg-l"><rect x="44" y="118" width="13" height="32" rx="6.5" fill="#ffd9b8"/><ellipse cx="50.5" cy="152" rx="11" ry="6" fill="#ff5c8a"/></g>
        <g class="leg leg-r"><rect x="63" y="118" width="13" height="32" rx="6.5" fill="#ffd9b8"/><ellipse cx="69.5" cy="152" rx="11" ry="6" fill="#ff5c8a"/></g>
      </g>
      <g class="arm arm-l"><rect x="28" y="90" width="13" height="34" rx="6.5" fill="#ffd9b8"/><circle cx="34.5" cy="125" r="7" fill="#ffd9b8"/></g>
      <path class="dress" d="M40 86 L80 86 L94 132 C72 140 48 140 26 132 Z" fill="#ff7aa2"/>
      <rect x="40" y="84" width="40" height="22" rx="10" fill="#ff7aa2"/>
      <circle cx="60" cy="98" r="3.5" fill="#fff" opacity=".9"/>
      <path d="M44 112 C52 108 68 108 76 112" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>
      <g class="head">
        <circle cx="60" cy="54" r="36" fill="#ffd9b8"/>
        <path class="hair" d="M24 60 C22 -6 98 -6 96 60 C92 44 86 50 80 56 C74 42 56 40 48 54 C42 48 32 46 24 60 Z" fill="#5a3a2a"/>
        <g class="bow">
          <ellipse cx="86" cy="28" rx="8" ry="5" fill="#ff4d79" transform="rotate(-30 86 28)"/>
          <ellipse cx="98" cy="34" rx="8" ry="5" fill="#ff4d79" transform="rotate(40 98 34)"/>
          <circle cx="92" cy="31" r="3.5" fill="#ffb3c6"/>
        </g>
        <ellipse class="blush" cx="36" cy="68" rx="7" ry="4" fill="#ff9bb3"/>
        <ellipse class="blush" cx="84" cy="68" rx="7" ry="4" fill="#ff9bb3"/>
        <g class="eyes">
          <g class="eye">
            <ellipse cx="46" cy="60" rx="4.5" ry="6.5" fill="#2b2b3a"/><circle cx="48" cy="57.5" r="1.8" fill="#fff"/>
            <path d="M40 54 L37 51 M43 52 L41 48" stroke="#2b2b3a" stroke-width="1.6" stroke-linecap="round"/>
          </g>
          <g class="eye">
            <ellipse cx="74" cy="60" rx="4.5" ry="6.5" fill="#2b2b3a"/><circle cx="76" cy="57.5" r="1.8" fill="#fff"/>
            <path d="M80 54 L83 51 M77 52 L79 48" stroke="#2b2b3a" stroke-width="1.6" stroke-linecap="round"/>
          </g>
        </g>
        <g class="heart-eyes">
          <path d="M46 65 C37 58 41 51 46 56 C51 51 55 58 46 65Z" fill="#ff4d79"/>
          <path d="M74 65 C65 58 69 51 74 56 C79 51 83 58 74 65Z" fill="#ff4d79"/>
        </g>
        <path class="mouth" d="M52 76 Q60 84 68 76" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="mouth-open" d="M53 75 Q60 88 67 75 Z" fill="#c0392b"/>
      </g>
      <g class="arm arm-r"><rect x="79" y="90" width="13" height="34" rx="6.5" fill="#ffd9b8"/><circle cx="85.5" cy="125" r="7" fill="#ffd9b8"/></g>
    </svg>
    </div>

    <div class="hint" id="hint"><span class="hint-icon">👆</span><span class="hint-text" id="hint-text"></span></div>

    <button class="replay" id="replay" type="button" aria-label="xem lại">🔁</button>

    <div class="fx" id="fx" aria-hidden="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
